# BizFlow POS System Properties

# Application
app.name=BizFlow POS
app.version=1.0.0
app.description=Desktop Point of Sale system for Retail / Supermarket

# Database Configuration
db.driver=org.sqlite.JDBC
db.url=jdbc:sqlite:retail_pos.db
db.username=
db.password=

# Logging
log.level=INFO
log.file.path=logs/retail_pos.log
log.max.file.size=10MB
log.max.files=5

# Retail Brand Colors
primary.color=#2563eb
primary.dark.color=#1d4ed8
primary.light.color=#3b82f6
accent.color=#16a34a
success.color=#16a34a
warning.color=#d97706
info.color=#2563eb
light.color=#f1f5f9
dark.color=#1e293b
text.color=#334155
background.color=#ffffff
surface.color=#f8fafc

# UI
ui.theme=light
ui.font.family=Segoe UI
ui.font.size=12
ui.window.width=1400
ui.window.height=900
ui.window.min.width=1280
ui.window.min.height=720

# POS Defaults
order.tax.rate=0.16
order.currency=KES
order.number.prefix=RCP

# Printer
printer.default=receipt
printer.paper.width=80
printer.auto.print.receipt=true

# Sync
sync.enabled=true
sync.interval=300
sync.api.base.url=https://pos.victoriousgeneralshop.com/api/
sync.offline.mode=true

# Security
security.session.timeout=1800
security.bcrypt.cost=12

# Performance
performance.cache.size=1000
performance.connection.pool.min=2
performance.connection.pool.max=10

# Feature Flags
feature.dark.mode=true
feature.auto.sync=true
feature.offline.mode=true
feature.loyalty=true
feature.expiry.tracking=true
